fint:
  application-id: fint-flyt-sourceapplication-instance-gateway

novari:
  cache:
    defaultCacheEntryTimeToLive: 6d
    defaultCacheHeapSize: 1000000

logging:
  level:
    no.novari.cache.ehcache.FintEhCacheEventLogger: WARN

server:
  error:
    include-message: always
  max-http-request-header-size: 40KB

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-resource-server
      - flyt-file-client

  http:
    codecs:
      max-in-memory-size: 100MB

  output:
    ansi:
      enabled: always
